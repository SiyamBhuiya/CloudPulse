services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse
      POSTGRES_DB: cloudpulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Not used yet. It will hold the latest metrics and rate limits.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: